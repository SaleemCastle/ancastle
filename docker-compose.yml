services:
  postgres:
    image: postgres:17-alpine
    container_name: ancastle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ancastle
      POSTGRES_PASSWORD: ancastle_dev
      POSTGRES_DB: ancastle_farms
    ports:
      - "5432:5432"
    volumes:
      - ancastle_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: ancastle-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ancastle_redis_data:/data

volumes:
  ancastle_postgres_data:
  ancastle_redis_data: