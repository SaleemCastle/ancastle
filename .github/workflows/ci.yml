name: CI

on:
    pull_request:
        branches:
            - main

    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    quality:
        name: Quality Checks
        runs-on: ubuntu-latest
        timeout-minutes: 15

        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ancastle_farms_test

        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: ancastle_farms_test
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d ancastle_farms_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Prisma client
              run: pnpm --filter @ancastle/api db:generate

            - name: Lint
              run: pnpm lint

            - name: Type check
              run: pnpm typecheck

            - name: Apply database migrations
              run: pnpm --filter @ancastle/api db:migrate:deploy

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build

            - name: Check formatting
              run: pnpm format:check
